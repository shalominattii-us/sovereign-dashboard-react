version: '3.8'

services:
  tsl-minter:
    build:
      context: .
      dockerfile: docker/Dockerfile.tsl
    container_name: sovereign-tsl-minter
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TSL_KEY_PATH=/app/keys/tsl-sovereign.pem
      - TSL_GLOBAL_CAP=${TSL_GLOBAL_CAP:-1000000000000000000}
      - TSL_HSM_ENABLED=${TSL_HSM_ENABLED:-false}
      - TSL_THRESHOLD_M=${TSL_THRESHOLD_M:-2}
      - TSL_THRESHOLD_N=${TSL_THRESHOLD_N:-3}
      - XRPL_TSL_SEED=${XRPL_TSL_SEED}
      - SOLANA_TSL_SECRET_KEY=${SOLANA_TSL_SECRET_KEY}
      - HEDERA_TSL_KEY=${HEDERA_TSL_KEY}
      - HEDERA_TSL_ACCOUNT=${HEDERA_TSL_ACCOUNT}
    volumes:
      - ./keys:/app/keys:ro
      - tsl-audit:/app/audit
      - tsl-logs:/app/logs
    networks:
      - sovereign-net
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: sovereign-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8443}:8443"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/sovereign
      - TSL_MINTER_URL=http://tsl-minter:3000
    volumes:
      - dashboard-logs:/app/logs
    networks:
      - sovereign-net
    depends_on:
      - tsl-minter
      - redis
      - postgres

  ai-inference:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    container_name: sovereign-ai-inference
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HF_API_KEY=${HF_API_KEY}
      - HF_MODEL=${HF_MODEL:-meta-llama/Llama-2-70b-chat-hf}
      - OR_API_KEY=${OR_API_KEY}
      - OR_MODEL=${OR_MODEL:-anthropic/claude-3-opus}
      - LOCAL_AI_URL=${LOCAL_AI_URL}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ai-cache:/app/cache
      - ai-logs:/app/logs
    networks:
      - sovereign-net
    depends_on:
      - redis

  attestation-oracle:
    build:
      context: .
      dockerfile: docker/Dockerfile.oracle
    container_name: sovereign-attestation-oracle
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - ORACLE_ID=${ORACLE_ID:-oracle-1}
      - TSL_MINTER_URL=http://tsl-minter:3000
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/sovereign
    volumes:
      - oracle-data:/app/data
    networks:
      - sovereign-net
    depends_on:
      - tsl-minter
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    container_name: sovereign-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - sovereign-net

  postgres:
    image: postgres:16-alpine
    container_name: sovereign-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-SovereignDB2026!}
      - POSTGRES_DB=sovereign
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sovereign-net

  nginx:
    image: nginx:alpine
    container_name: sovereign-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - sovereign-net
    depends_on:
      - dashboard-server

  prometheus:
    image: prom/prometheus:latest
    container_name: sovereign-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - sovereign-net

  grafana:
    image: grafana/grafana:latest
    container_name: sovereign-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-SovereignGrafana2026!}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - sovereign-net
    depends_on:
      - prometheus

volumes:
  tsl-audit:
  tsl-logs:
  dashboard-logs:
  ai-cache:
  ai-logs:
  oracle-data:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  sovereign-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
